<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quant Dashboard</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0f111a', // Super dark blue/black background
                            800: '#1a1d2d', // Cards / Panels
                            700: '#262a40', // Borders
                            600: '#4b5563',
                        },
                        brand: {
                            primary: '#6366f1',   // Indigo
                            accent: '#8b5cf6',    // Purple
                            success: '#10b981',   // Green
                            danger: '#ef4444',    // Red
                            warning: '#f59e0b',   // Amber
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            background-color: #0f111a;
            color: #e5e7eb;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Glassmorphism utilities */
        .glass {
            background: rgba(26, 29, 45, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f111a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #262a40; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563; 
        }

        /* Data Input Styling */
        .data-input {
            width: 100%;
            background: transparent;
            border: 1px solid #262a40;
            border-radius: 6px;
            padding: 8px 12px;
            color: #e5e7eb;
            text-align: right;
            outline: none;
            transition: all 0.2s;
            font-variant-numeric: tabular-nums;
        }
        .data-input:focus {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.05);
        }
        /* Hide number arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden antialiased selection:bg-brand-primary/30">

    <!-- Sidebar Navigation -->
    <nav class="w-20 md:w-64 border-r border-dark-700 bg-dark-900/50 backdrop-blur-xl flex flex-col justify-between shrink-0">
        <div>
            <div class="h-20 flex items-center justify-center md:justify-start md:px-6 border-b border-dark-700">
                <i class="ph-fill ph-chart-line-up text-3xl text-brand-primary"></i>
                <span class="ml-3 font-bold text-xl hidden md:block tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-brand-primary to-brand-accent">Q-Dash</span>
            </div>
            <div class="flex flex-col gap-2 p-3 mt-4">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex items-center gap-3 w-full p-3 rounded-lg text-brand-primary bg-brand-primary/10 transition-all hover:bg-brand-primary/20 group">
                    <i class="ph ph-squares-four text-2xl group-hover:scale-110 transition-transform"></i>
                    <span class="font-medium hidden md:block">Dashboard</span>
                </button>
                <button onclick="switchTab('analysis')" id="nav-analysis" class="flex items-center gap-3 w-full p-3 rounded-lg text-gray-400 hover:text-white hover:bg-dark-800 transition-all group">
                    <i class="ph ph-magnifying-glass-chart text-2xl group-hover:scale-110 transition-transform"></i>
                    <span class="font-medium hidden md:block">Deep Analysis</span>
                </button>
                <button onclick="switchTab('data')" id="nav-data" class="flex items-center gap-3 w-full p-3 rounded-lg text-gray-400 hover:text-white hover:bg-dark-800 transition-all group">
                    <i class="ph ph-database text-2xl group-hover:scale-110 transition-transform"></i>
                    <span class="font-medium hidden md:block">Data Entry</span>
                </button>
            </div>
        </div>
        <div class="p-4 border-t border-dark-700 hidden md:block text-xs text-gray-500 text-center">
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto relative bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-dark-800 via-dark-900 to-dark-900">
        
        <!-- DASHBOARD VIEW -->
        <div id="dashboard-view" class="p-6 md:p-10 max-w-7xl mx-auto space-y-8 block">
            
            <header>
                <h1 class="text-3xl font-bold tracking-tight text-white">Strategy Overview</h1>
                <p class="text-gray-400 mt-1">AI Recommendation & Equity Curves</p>
            </header>

            <!-- Recommendation Engine Box -->
            <div class="glass p-8 rounded-2xl relative overflow-hidden group">
                <div class="absolute top-0 right-0 p-8 opacity-10 group-hover:opacity-20 transition-opacity">
                    <i class="ph-fill ph-target text-9xl text-brand-primary"></i>
                </div>
                <div class="relative z-10" id="recommendation-content">
                    <!-- Dynamic recommendation will load here -->
                    <div class="animate-pulse flex space-x-4">
                        <div class="flex-1 space-y-4 py-1">
                            <div class="h-4 bg-dark-700 rounded w-3/4"></div>
                            <div class="space-y-2">
                                <div class="h-4 bg-dark-700 rounded"></div>
                                <div class="h-4 bg-dark-700 rounded w-5/6"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Charts Container -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="glass p-6 rounded-2xl">
                    <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                        <i class="ph ph-trend-up text-brand-accent"></i> Nifty Equity Curves
                    </h3>
                    <div class="h-[300px] w-full">
                        <canvas id="niftyChart"></canvas>
                    </div>
                </div>
                <div class="glass p-6 rounded-2xl">
                    <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                        <i class="ph ph-trend-up text-brand-accent"></i> Sensex Equity Curves
                    </h3>
                    <div class="h-[300px] w-full">
                        <canvas id="sensexChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- DEEP ANALYSIS VIEW -->
        <div id="analysis-view" class="p-6 md:p-10 max-w-7xl mx-auto space-y-8 hidden">
            <header class="flex justify-between items-end">
                <div>
                    <h1 class="text-3xl font-bold tracking-tight text-white">Deep Analysis</h1>
                    <p class="text-gray-400 mt-1">Detailed statistical breakdown</p>
                </div>
                <div class="glass p-1 rounded-lg inline-flex">
                    <button onclick="setAnalysisIndex('Nifty')" id="btn-analyze-nifty" class="px-4 py-2 text-sm font-medium rounded-md bg-dark-700 text-white shadow transition-all">Nifty</button>
                    <button onclick="setAnalysisIndex('Sensex')" id="btn-analyze-sensex" class="px-4 py-2 text-sm font-medium rounded-md text-gray-400 hover:text-white transition-all">Sensex</button>
                </div>
            </header>

            <div class="glass rounded-xl border border-dark-700 overflow-hidden overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="text-xs text-gray-400 uppercase bg-dark-800 border-b border-dark-700">
                        <tr>
                            <th class="px-6 py-4">Strategy</th>
                            <th class="px-6 py-4 text-right" title="Overall Average">Avg Return</th>
                            <th class="px-6 py-4 text-right" title="Average return on Non-Expiry days">Non-Exp Avg</th>
                            <th class="px-6 py-4 text-right" title="Average return on Expiry days">Exp Avg</th>
                            <th class="px-6 py-4 text-right">Total Return</th>
                            <th class="px-6 py-4 text-right">Win Rate</th>
                            <th class="px-6 py-4 text-right" title="Standard Deviation">Volatility</th>
                            <th class="px-6 py-4 text-right text-brand-danger">Max Drawdown</th>
                            <th class="px-6 py-4 text-right text-brand-primary" title="Risk adjusted return score">Consistency Score</th>
                        </tr>
                    </thead>
                    <tbody id="analysis-table-body" class="divide-y divide-dark-700">
                        <!-- Dynamic Content -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- DATA ENTRY VIEW -->
        <div id="data-view" class="p-6 md:p-10 max-w-screen-2xl mx-auto space-y-6 hidden">
            
            <header class="flex flex-col md:flex-row md:justify-between md:items-center gap-4">
                <div>
                    <h1 class="text-3xl font-bold tracking-tight text-white">Daily Data Entry</h1>
                    <p class="text-gray-400 mt-1"></p>
                </div>
                <div class="flex gap-3">
                    <div class="flex items-center glass px-3 py-1.5 rounded-lg border border-dark-700 focus-within:border-brand-primary transition-colors">
                        <input type="date" id="manual-date-input" class="bg-transparent border-none text-sm text-gray-300 outline-none w-36">
                        <button onclick="addDateManually()" class="ml-2 text-brand-primary hover:text-brand-accent transition-colors">
                            <i class="ph-bold ph-plus"></i> Add Date
                        </button>
                    </div>
                    <button onclick="promptAddStrategy()" class="bg-dark-800 hover:bg-dark-700 text-white px-4 py-2 rounded-lg border border-dark-700 transition-colors flex items-center gap-2 text-sm font-medium">
                        <i class="ph-bold ph-plus-circle"></i> Add Strategy
                    </button>
                </div>
            </header>

            <div class="glass rounded-xl border border-dark-700 overflow-hidden overflow-x-auto shadow-2xl">
                <table class="w-full text-sm text-left">
                    <thead class="text-xs text-gray-400 uppercase bg-dark-800 border-b border-dark-700" id="data-table-head">
                        <!-- Dynamically built header -->
                    </thead>
                    <tbody id="data-table-body" class="divide-y divide-dark-700/50">
                        <!-- Dynamically built rows -->
                    </tbody>
                </table>
            </div>
            <p class="text-xs text-gray-500 text-center pb-10"></p>
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        // --- Core State Management ---
        const STORAGE_KEY = 'quant_dashboard_data_v2'; // Bumped version for new format
        
        let state = {
            strategies: ['SwingKing Sniper', 'Booming Bulls', 'Bullseys', 'Aakash'],
            dates: [], // Auto-populated
            deletedDates: [], // Track user deleted dates
            data: {}, // Format: { "23-Jun-2026": { "Nifty": { "Strat": 10.5 }, "Sensex": { ... } } }
            expiries: {} // Format: { "23-Jun-2026": { "Nifty": true, "Sensex": false } }
        };

        const colors = [
            '#6366f1', // Indigo
            '#10b981', // Emerald
            '#f59e0b', // Amber
            '#ec4899', // Pink
            '#3b82f6', // Blue
            '#8b5cf6', // Purple
            '#14b8a6', // Teal
            '#f43f5e'  // Rose
        ];

        let currentTab = 'dashboard';
        let analysisIndex = 'Nifty';
        let charts = { nifty: null, sensex: null };

        // --- Math & Analytics Utilities ---
        const MathUtils = {
            average: arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0,
            stdDev: arr => {
                if (arr.length < 2) return 0;
                const mean = MathUtils.average(arr);
                const variance = arr.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (arr.length - 1);
                return Math.sqrt(variance);
            },
            equityCurve: arr => {
                let curve = [0]; // Start at 0
                let current = 0;
                for(let val of arr) {
                    current += val; // Simple additive compounding for percentages
                    curve.push(current);
                }
                return curve;
            },
            cumulativeReturn: arr => arr.reduce((a, b) => a + b, 0), // Additive
            maxDrawdown: curve => {
                let maxDD = 0;
                let peak = curve[0];
                for(let val of curve) {
                    if (val > peak) peak = val;
                    let dd = peak - val;
                    if (dd > maxDD) maxDD = dd;
                }
                return maxDD;
            },
            winRate: arr => arr.length ? (arr.filter(x => x > 0).length / arr.length) * 100 : 0
        };

        // --- Date Utilities ---
        const START_DATE = new Date("2026-06-23T00:00:00");

        function formatDate(date) {
            const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
            const d = date.getDate().toString().padStart(2, '0');
            const m = months[date.getMonth()];
            const y = date.getFullYear();
            return `${d}-${m}-${y}`;
        }

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state.strategies = parsed.strategies || state.strategies;
                    state.dates = parsed.dates || state.dates;
                    state.data = parsed.data || state.data;
                    state.deletedDates = parsed.deletedDates || [];
                    state.expiries = parsed.expiries || state.expiries;
                } catch(e) {
                    console.error("Failed to parse local storage", e);
                }
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function generateMissingDates() {
            let today = new Date();
            let tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);

            let current = new Date(START_DATE);
            
            while (current <= tomorrow) {
                let dayOfWeek = current.getDay();
                // Skip Saturday (6) and Sunday (0)
                if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                    let dateStr = formatDate(current);
                    
                    if (!state.dates.includes(dateStr) && !state.deletedDates.includes(dateStr)) {
                        state.dates.push(dateStr);
                    }
                }
                current.setDate(current.getDate() + 1);
            }

            // Ensure sorting
            state.dates.sort((a, b) => new Date(a) - new Date(b));

            // Ensure data object and expiries exist for dates
            state.dates.forEach(date => {
                if(!state.data[date]) state.data[date] = { Nifty: {}, Sensex: {} };
                if(!state.expiries[date]) state.expiries[date] = { Nifty: false, Sensex: false };
            });
            
            saveState();
        }

        function switchTab(tabId) {
            currentTab = tabId;
            
            // Hide all views
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('analysis-view').classList.add('hidden');
            document.getElementById('data-view').classList.add('hidden');
            
            // Reset nav styles
            ['dashboard', 'analysis', 'data'].forEach(t => {
                const el = document.getElementById(`nav-${t}`);
                el.className = "flex items-center gap-3 w-full p-3 rounded-lg text-gray-400 hover:text-white hover:bg-dark-800 transition-all group";
            });

            // Show active view and style nav
            document.getElementById(`${tabId}-view`).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).className = "flex items-center gap-3 w-full p-3 rounded-lg text-brand-primary bg-brand-primary/10 transition-all hover:bg-brand-primary/20 group";

            if (tabId === 'dashboard') renderDashboard();
            if (tabId === 'analysis') renderAnalysis();
            if (tabId === 'data') renderDataEntry();
        }

        function setAnalysisIndex(index) {
            analysisIndex = index;
            if(index === 'Nifty') {
                document.getElementById('btn-analyze-nifty').className = "px-4 py-2 text-sm font-medium rounded-md bg-dark-700 text-white shadow transition-all";
                document.getElementById('btn-analyze-sensex').className = "px-4 py-2 text-sm font-medium rounded-md text-gray-400 hover:text-white transition-all";
            } else {
                document.getElementById('btn-analyze-sensex').className = "px-4 py-2 text-sm font-medium rounded-md bg-dark-700 text-white shadow transition-all";
                document.getElementById('btn-analyze-nifty').className = "px-4 py-2 text-sm font-medium rounded-md text-gray-400 hover:text-white transition-all";
            }
            renderAnalysis();
        }

        // --- Data Manipulation ---
        function promptAddStrategy() {
            const name = prompt("Enter new strategy name:");
            if (name && name.trim() && !state.strategies.includes(name.trim())) {
                state.strategies.push(name.trim());
                saveState();
                renderDataEntry();
            }
        }

        function addDateManually() {
            const input = document.getElementById('manual-date-input').value;
            if (!input) return;
            
            let d = new Date(input);
            let newDateStr = formatDate(d);
            
            if (!state.dates.includes(newDateStr)) {
                state.dates.push(newDateStr);
                state.dates.sort((a, b) => new Date(a) - new Date(b)); // Keep sorted
                state.data[newDateStr] = { Nifty: {}, Sensex: {} };
                state.expiries[newDateStr] = { Nifty: false, Sensex: false };
                state.deletedDates = state.deletedDates.filter(x => x !== newDateStr); // remove from deleted
                saveState();
                renderDataEntry();
            }
        }

        function deleteDate(dateStr) {
            state.dates = state.dates.filter(d => d !== dateStr);
            if (!state.deletedDates.includes(dateStr)) {
                state.deletedDates.push(dateStr); // remember so generator doesn't bring it back
            }
            delete state.data[dateStr];
            delete state.expiries[dateStr];
            saveState();
            renderDataEntry();
        }

        function updateData(date, index, strategy, value) {
            if(!state.data[date]) state.data[date] = { Nifty: {}, Sensex: {} };
            if(!state.data[date][index]) state.data[date][index] = {};
            
            state.data[date][index][strategy] = value;
            saveState();
        }

        // Handle Interactive Expiry Toggle Button
        function toggleExpiryUI(btnEl, date, index) {
            let isActive = state.expiries[date]?.[index] || false;
            let newState = !isActive;
            
            if(!state.expiries[date]) state.expiries[date] = { Nifty: false, Sensex: false };
            state.expiries[date][index] = newState;
            saveState();
            
            // Visual Update for the Button
            if (newState) {
                btnEl.className = "text-[10px] font-bold px-2.5 py-1 rounded transition-all duration-300 border cursor-pointer uppercase bg-brand-warning/20 text-brand-warning border-brand-warning/50 shadow-[0_0_10px_rgba(245,158,11,0.25)]";
            } else {
                btnEl.className = "text-[10px] font-bold px-2.5 py-1 rounded transition-all duration-300 border cursor-pointer uppercase bg-dark-800 text-gray-600 border-dark-700 hover:text-gray-300 hover:border-dark-500";
            }
        }

        // Handle Real-time Profit/Loss Color Highlighting
        function updateInputColor(inputEl) {
            let val = parseFloat(inputEl.value);
            // Remove specific colors
            inputEl.classList.remove('!bg-brand-success/10', '!border-brand-success/50', '!text-brand-success', '!bg-brand-danger/10', '!border-brand-danger/50', '!text-brand-danger');
            
            if (!isNaN(val)) {
                if (val > 0) {
                    inputEl.classList.add('!bg-brand-success/10', '!border-brand-success/50', '!text-brand-success');
                } else if (val < 0) {
                    inputEl.classList.add('!bg-brand-danger/10', '!border-brand-danger/50', '!text-brand-danger');
                }
            }
        }

        // --- Data Computation ---
        function getStrategyMetrics(strategy, index) {
            let returns = [];
            let normalReturns = [];
            let expiryReturns = [];
            
            // Chronological order for equity curve
            state.dates.forEach(d => {
                let val = state.data[d]?.[index]?.[strategy];
                let isExp = state.expiries[d]?.[index] || false;
                
                if (val !== undefined && val !== null && val !== "") {
                    let num = parseFloat(val);
                    returns.push(num);
                    if (isExp) expiryReturns.push(num);
                    else normalReturns.push(num);
                }
            });

            const avg = MathUtils.average(returns);
            const normalAvg = MathUtils.average(normalReturns);
            const expiryAvg = MathUtils.average(expiryReturns);
            const std = MathUtils.stdDev(returns);
            const eqCurve = MathUtils.equityCurve(returns);
            const totalRet = MathUtils.cumulativeReturn(returns);
            const maxDD = MathUtils.maxDrawdown(eqCurve);
            const wr = MathUtils.winRate(returns);

            // Consistency Score Calculation (Heavily weighted on non-expiry days to avoid skew)
            let score = 0;
            if (returns.length > 0) {
                const risk = std === 0 ? 0.1 : std;
                const scoringAvg = normalReturns.length > 0 ? normalAvg : avg;
                
                // Penalize heavily for max drawdown
                let ddPenalty = Math.max(0.01, (100 - maxDD) / 100);
                
                // Sharpe-like ratio * Drawdown Safety * WinRate multiplier
                score = (scoringAvg / risk) * ddPenalty * (wr/50);
            }

            return {
                returns,
                avg,
                normalAvg,
                expiryAvg,
                std,
                totalRet,
                maxDD,
                wr,
                score,
                eqCurve,
                expiryCount: expiryReturns.length
            };
        }

        function getAllMetrics() {
            let res = { Nifty: {}, Sensex: {} };
            state.strategies.forEach(s => {
                res.Nifty[s] = getStrategyMetrics(s, 'Nifty');
                res.Sensex[s] = getStrategyMetrics(s, 'Sensex');
            });
            return res;
        }

        // --- Renderers ---
        function renderDataEntry() {
            const head = document.getElementById('data-table-head');
            const tbody = document.getElementById('data-table-body');

            // Build Header
            let headHTML = `<tr>
                <th class="px-4 py-3 sticky left-0 bg-dark-800 z-20 shadow-[2px_0_5px_rgba(0,0,0,0.5)]">Date</th>
                <th class="px-4 py-3 border-r border-dark-700 min-w-[120px]">Index</th>`;
            state.strategies.forEach(s => {
                headHTML += `<th class="px-4 py-3 text-right min-w-[150px]"><div class="flex justify-end">${s}</div></th>`;
            });
            headHTML += `</tr>`;
            head.innerHTML = headHTML;

            // Build Body
            let bodyHTML = '';

            // Render from newest to oldest for easier entry
            [...state.dates].reverse().forEach(date => {
                
                let isNiftyExp = state.expiries[date]?.Nifty;
                let niftyExpClass = isNiftyExp 
                    ? "bg-brand-warning/20 text-brand-warning border-brand-warning/50 shadow-[0_0_10px_rgba(245,158,11,0.25)]" 
                    : "bg-dark-800 text-gray-600 border-dark-700 hover:text-gray-300 hover:border-dark-500";

                let isSensexExp = state.expiries[date]?.Sensex;
                let sensexExpClass = isSensexExp 
                    ? "bg-brand-warning/20 text-brand-warning border-brand-warning/50 shadow-[0_0_10px_rgba(245,158,11,0.25)]" 
                    : "bg-dark-800 text-gray-600 border-dark-700 hover:text-gray-300 hover:border-dark-500";

                // Nifty Row
                bodyHTML += `<tr class="hover:bg-dark-800/50 transition-colors">
                    <td class="px-4 py-3 whitespace-nowrap bg-dark-900 border-r border-dark-700 sticky left-0 z-10 font-medium flex items-center justify-between group shadow-[2px_0_5px_rgba(0,0,0,0.2)]">
                        ${date}
                        <button onclick="deleteDate('${date}')" class="text-dark-600 group-hover:text-brand-danger transition-colors" title="Delete Date"><i class="ph-bold ph-x"></i></button>
                    </td>
                    <td class="px-4 py-3 text-brand-accent font-semibold bg-dark-900/50 border-r border-dark-700">
                        <div class="flex items-center justify-between">
                            <span>Nifty</span>
                            <button onclick="toggleExpiryUI(this, '${date}', 'Nifty')" class="text-[10px] font-bold px-2.5 py-1 rounded transition-all duration-300 border cursor-pointer uppercase ${niftyExpClass}" title="Toggle Expiry Day">Exp</button>
                        </div>
                    </td>`;
                
                state.strategies.forEach(s => {
                    let val = state.data[date]?.Nifty?.[s] ?? '';
                    let numVal = parseFloat(val);
                    let colorClasses = '';
                    if (!isNaN(numVal)) {
                        if (numVal > 0) colorClasses = '!bg-brand-success/10 !border-brand-success/50 !text-brand-success';
                        else if (numVal < 0) colorClasses = '!bg-brand-danger/10 !border-brand-danger/50 !text-brand-danger';
                    }
                    bodyHTML += `<td class="px-4 py-3"><input type="number" step="any" class="data-input transition-colors duration-300 ${colorClasses}" placeholder="0.00" value="${val}" oninput="updateInputColor(this)" onchange="updateData('${date}', 'Nifty', '${s}', this.value)"></td>`;
                });
                bodyHTML += `</tr>`;

                // Sensex Row
                bodyHTML += `<tr class="hover:bg-dark-800/50 transition-colors border-b-[3px] border-dark-700">
                    <td class="px-4 py-3 whitespace-nowrap bg-dark-900 border-r border-dark-700 sticky left-0 z-10 shadow-[2px_0_5px_rgba(0,0,0,0.2)]"></td>
                    <td class="px-4 py-3 text-gray-400 font-semibold bg-dark-900/50 border-r border-dark-700">
                        <div class="flex items-center justify-between">
                            <span>Sensex</span>
                            <button onclick="toggleExpiryUI(this, '${date}', 'Sensex')" class="text-[10px] font-bold px-2.5 py-1 rounded transition-all duration-300 border cursor-pointer uppercase ${sensexExpClass}" title="Toggle Expiry Day">Exp</button>
                        </div>
                    </td>`;
                
                state.strategies.forEach(s => {
                    let val = state.data[date]?.Sensex?.[s] ?? '';
                    let numVal = parseFloat(val);
                    let colorClasses = '';
                    if (!isNaN(numVal)) {
                        if (numVal > 0) colorClasses = '!bg-brand-success/10 !border-brand-success/50 !text-brand-success';
                        else if (numVal < 0) colorClasses = '!bg-brand-danger/10 !border-brand-danger/50 !text-brand-danger';
                    }
                    bodyHTML += `<td class="px-4 py-3"><input type="number" step="any" class="data-input transition-colors duration-300 ${colorClasses}" placeholder="0.00" value="${val}" oninput="updateInputColor(this)" onchange="updateData('${date}', 'Sensex', '${s}', this.value)"></td>`;
                });
                bodyHTML += `</tr>`;
            });

            if (state.dates.length === 0) {
                bodyHTML = `<tr><td colspan="${state.strategies.length + 2}" class="text-center py-8 text-gray-500">No dates generated. Check settings.</td></tr>`;
            }

            tbody.innerHTML = bodyHTML;
        }

        function renderDashboard() {
            const allMetrics = getAllMetrics();
            const recContent = document.getElementById('recommendation-content');
            
            // Find best overall based on Consistency Score
            let bestOverall = null;
            let highestScore = -Infinity;

            ['Nifty', 'Sensex'].forEach(index => {
                state.strategies.forEach(s => {
                    const m = allMetrics[index][s];
                    if (m.returns.length > 0 && m.score > highestScore) {
                        highestScore = m.score;
                        bestOverall = { strategy: s, index: index, metrics: m };
                    }
                });
            });

            // Render Recommendation
            if (bestOverall && bestOverall.metrics.returns.length > 0) {
                const m = bestOverall.metrics;
                let daysCount = m.returns.length;
                let confidenceStr = daysCount < 10 
                    ? `<span class="text-brand-warning text-xs border border-brand-warning px-2 py-0.5 rounded-full ml-2">Low Confidence (${daysCount} days data)</span>` 
                    : `<span class="text-brand-success text-xs border border-brand-success px-2 py-0.5 rounded-full ml-2">High Confidence</span>`;

                recContent.innerHTML = `
                    <h2 class="text-3xl md:text-4xl font-bold text-white mb-2 flex items-center flex-wrap gap-2">
                        ${bestOverall.strategy} <span class="text-brand-primary text-xl font-normal">on ${bestOverall.index}</span>
                        ${confidenceStr}
                    </h2>
                    <p class="text-gray-400 mb-6 max-w-2xl text-sm leading-relaxed">
                        Based on quantitative analysis balancing pure returns against volatility and max drawdown. The scoring engine heavily weights <strong>Non-Expiry day consistency</strong> to prevent skewed results from single-day spikes.
                    </p>
                    
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6 border-t border-dark-700/50 pt-6">
                        <div>
                            <p class="text-xs text-gray-500 uppercase tracking-wider mb-1">Consistency Score</p>
                            <p class="text-2xl font-bold text-brand-primary">${m.score.toFixed(2)}</p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 uppercase tracking-wider mb-1">Avg Return (Non-Exp)</p>
                            <p class="text-2xl font-bold text-white">${m.normalAvg.toFixed(2)}%</p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 uppercase tracking-wider mb-1">Max Drawdown</p>
                            <p class="text-2xl font-bold text-brand-danger">${m.maxDD.toFixed(2)}%</p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-500 uppercase tracking-wider mb-1">Win Rate</p>
                            <p class="text-2xl font-bold text-white">${m.wr.toFixed(0)}%</p>
                        </div>
                    </div>
                `;
            } else {
                recContent.innerHTML = `
                    <h2 class="text-2xl font-bold text-gray-300 mb-2">Awaiting Data</h2>
                    <p class="text-gray-500 text-sm">Please enter strategy returns in the Data Entry tab to generate recommendations.</p>
                `;
            }

            renderCharts(allMetrics);
        }

        function renderCharts(allMetrics) {
            // Setup chart data structure
            const createChartConfig = (indexStr) => {
                let labels = ['Start']; // Starting point 0
                // Find longest dataset for labels
                let maxLen = 0;
                state.strategies.forEach(s => {
                    if (allMetrics[indexStr][s].returns.length > maxLen) maxLen = allMetrics[indexStr][s].returns.length;
                });
                for(let i=1; i<=maxLen; i++) labels.push(`T+${i}`);

                let datasets = state.strategies.map((s, i) => {
                    return {
                        label: s,
                        data: allMetrics[indexStr][s].eqCurve,
                        borderColor: colors[i % colors.length],
                        backgroundColor: colors[i % colors.length],
                        borderWidth: 2,
                        tension: 0.4, // Slightly smoother curves
                        pointRadius: 0,
                        pointHitRadius: 15, // Easier to hover over
                        pointHoverRadius: 5
                    }
                });

                return {
                    type: 'line',
                    data: { labels, datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: { 
                                position: 'top',
                                align: 'center',
                                labels: { 
                                    color: '#d1d5db', // Lighter text
                                    usePointStyle: true, 
                                    pointStyle: 'circle',
                                    boxWidth: 8,
                                    boxHeight: 8,
                                    padding: 24, // Fixes the overlapping issue
                                    font: {
                                        family: "'Inter', sans-serif",
                                        size: 13,
                                        weight: '500'
                                    }
                                } 
                            },
                            tooltip: {
                                backgroundColor: 'rgba(15, 17, 26, 0.95)',
                                titleColor: '#ffffff',
                                bodyColor: '#d1d5db',
                                borderColor: '#262a40',
                                borderWidth: 1,
                                padding: 12,
                                boxPadding: 6,
                                usePointStyle: true,
                                titleFont: { family: "'Inter', sans-serif", size: 13 },
                                bodyFont: { family: "'Inter', sans-serif", size: 12 },
                                callbacks: {
                                    label: function(context) {
                                        return ' ' + context.dataset.label + ': ' + context.parsed.y.toFixed(2) + '%';
                                    }
                                }
                            }
                        },
                        scales: {
                            x: { 
                                grid: { color: 'rgba(38, 42, 64, 0.3)', drawBorder: false }, 
                                ticks: { color: '#6b7280', font: { family: "'Inter', sans-serif" }, padding: 8 } 
                            },
                            y: { 
                                border: { dash: [4, 4] },
                                grid: { color: 'rgba(38, 42, 64, 0.3)', drawBorder: false, tickLength: 0 }, 
                                ticks: { 
                                    color: '#6b7280', 
                                    font: { family: "'Inter', sans-serif" },
                                    padding: 8,
                                    callback: function(value) { return value + "%" } 
                                } 
                            }
                        }
                    }
                };
            };

            // Nifty Chart
            if (charts.nifty) charts.nifty.destroy();
            const ctxNifty = document.getElementById('niftyChart').getContext('2d');
            charts.nifty = new Chart(ctxNifty, createChartConfig('Nifty'));

            // Sensex Chart
            if (charts.sensex) charts.sensex.destroy();
            const ctxSensex = document.getElementById('sensexChart').getContext('2d');
            charts.sensex = new Chart(ctxSensex, createChartConfig('Sensex'));
        }

        function renderAnalysis() {
            const allMetrics = getAllMetrics();
            const metrics = allMetrics[analysisIndex];
            const tbody = document.getElementById('analysis-table-body');
            
            // Find best values for highlighting
            let maxAvg = -Infinity, minStd = Infinity, minDD = Infinity, maxScore = -Infinity;
            state.strategies.forEach(s => {
                const m = metrics[s];
                if(m.returns.length > 0) {
                    if(m.avg > maxAvg) maxAvg = m.avg;
                    if(m.std < minStd) minStd = m.std;
                    if(m.maxDD < minDD) minDD = m.maxDD;
                    if(m.score > maxScore) maxScore = m.score;
                }
            });

            let html = '';
            state.strategies.forEach((s, i) => {
                const m = metrics[s];
                if(m.returns.length === 0) return;

                const cAvg = m.avg === maxAvg ? 'text-brand-success font-bold' : 'text-gray-300';
                const cTotal = 'text-white font-medium';
                const cWr = m.wr > 50 ? 'text-brand-success' : 'text-brand-danger';
                const cStd = m.std === minStd ? 'text-brand-accent font-bold' : 'text-gray-300';
                const cDd = m.maxDD === minDD ? 'text-brand-success font-bold' : 'text-brand-danger opacity-80';
                const cScore = m.score === maxScore ? 'text-brand-primary font-bold text-lg' : 'text-gray-300';
                
                // Expiry Skew warning (if expiry avg is much higher than normal avg)
                const isExpirySkewed = m.expiryCount > 0 && m.expiryAvg > (m.normalAvg * 1.5) && m.expiryAvg > 0;
                const cExp = isExpirySkewed ? 'text-brand-warning font-semibold' : 'text-gray-400';

                html += `
                <tr class="hover:bg-dark-800 transition-colors">
                    <td class="px-6 py-4 font-medium flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full shadow-[0_0_8px_rgba(255,255,255,0.3)]" style="background-color: ${colors[i%colors.length]}"></span>
                        ${s}
                    </td>
                    <td class="px-6 py-4 text-right ${cAvg}">${m.avg.toFixed(2)}%</td>
                    <td class="px-6 py-4 text-right text-gray-300">${m.normalAvg.toFixed(2)}%</td>
                    <td class="px-6 py-4 text-right ${cExp}" title="${m.expiryCount} Expiry days recorded">${m.expiryAvg.toFixed(2)}%</td>
                    <td class="px-6 py-4 text-right ${cTotal}">${m.totalRet.toFixed(2)}%</td>
                    <td class="px-6 py-4 text-right ${cWr}">${m.wr.toFixed(0)}%</td>
                    <td class="px-6 py-4 text-right ${cStd}">${m.std.toFixed(2)}</td>
                    <td class="px-6 py-4 text-right ${cDd}">${m.maxDD.toFixed(2)}%</td>
                    <td class="px-6 py-4 text-right ${cScore}">${m.score.toFixed(2)}</td>
                </tr>
                `;
            });

            if(!html) {
                html = `<tr><td colspan="9" class="text-center py-8 text-gray-500">No data available for ${analysisIndex}.</td></tr>`;
            }

            tbody.innerHTML = html;
        }

        // --- Bootstrapping ---
        function init() {
            loadState();
            generateMissingDates(); // Will auto add up to tomorrow's date
            switchTab('dashboard'); // Initial render
        }

        // Start App
        init();

    </script>
</body>
</html>
